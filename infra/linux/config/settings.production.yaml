# 生产 Worker 的非敏感模型设置。
# 凭证只通过 apiKeyEnv 引用，不在此文件或仓库中保存密钥值。
agent-default-model:
  provider: openai
  model: gpt-5.6-luna
  reasoningEffort: max

llm-deepseek:
  baseURL: https://api.commandcode.ai/provider/v1
  apiKeyEnv: DEEPSEEK_API_KEY
  models:
    - id: deepseek-v4.1-flash
      name: DeepSeek V4.1 Flash
  modelAliases:
    deepseek-v4.1-flash: deepseek/deepseek-v4.1-flash
  disabledModels: []

llm-pi-ai:
  providers:
    openai:
      baseURL: https://cpa.rwr.ink/v1
      api: openai-responses
      models:
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-6-astra
          name: GPT-6 Astra
          reasoningEfforts:
            off: none
            low: low
            medium: medium
            high: high
            max: max
      apiKeyEnv: OPENAI_API_KEY
