# Linux production: Gateway remains a tool-free loopback consumer of Worker.
- id: account-bot-fleet
  config:
    authEndpoint: http://127.0.0.1:13080/internal/feishu-bots
    tokenEnv: AUTH_PAIRING_TOKEN
    stateDir: /var/lib/dsh/account-bots
    uploadsRoot: /var/lib/dsh/uploads/account-bots

- id: lark-run-client
  config:
    baseURL: http://127.0.0.1:18788
    tokenEnv: WORKER_TOKEN
