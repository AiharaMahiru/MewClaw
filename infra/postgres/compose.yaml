# Docker 版 pgvector PostgreSQL（与便携版并行提供，不强制使用）。
# 来源：lark-claw infra/postgres（整体平移，M0；卷名改 dsh-lark-postgres）。
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: lark_claw
      POSTGRES_USER: lark_claw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dsh-lark-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lark_claw -d lark_claw"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dsh-lark-postgres:
