# dsh-lark-gateway-bundle：网关组合层（独立于 dsh-base——网关绝不含工具/agent 行）。
# 只提供账号机器人宿主；客户端/长连接/渲染/命令由fleet在独立账号根装载。

- insert:
    # 凭证提供方（项目 .env 层回退，经 app bin 的 loadLayeredEnv 冻结环境快照）。
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    # CDG 加密附件桥接（网关保存附件时探测加密标记；未配置 = 明文语义）。
    - id: cdg-bridge
      name: 'dsh-cdg-bridge'
      config:
        command: !!js process.env.CDG_BRIDGE_PATH

    # worker 桥接客户端（本机部署 loopback；8788 = 迁移期并存端口）。
    - id: lark-run-client
      name: 'dsh-lark-run-client'
      config:
        # Worker 的 /v1/* 运行 API 与 DSH Web UI 分离；3081 只给浏览器 Web 面。
        baseURL: 'http://127.0.0.1:8788'
        tokenEnv: WORKER_TOKEN

    # 宿主面编排（授权/去重/Scope 引导/运行协调/审批呈现）。
    - id: account-bot-fleet
      name: 'dsh-lark-gateway/bot-fleet'
      config:
        authEndpoint: !!js (process.env.AUTH_PAIRING_ENDPOINT ?? 'http://127.0.0.1:3080/internal/pairing/start').replace('/internal/pairing/start', '/internal/feishu-bots')
        tokenEnv: AUTH_PAIRING_TOKEN
        stateDir: var/account-bots
        uploadsRoot: !!js process.cwd() + '/.uploads/account-bots'
        pollIntervalMs: 5000
